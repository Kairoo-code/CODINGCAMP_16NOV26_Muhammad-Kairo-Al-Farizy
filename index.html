<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Theme toggle (top-right corner) -->
  <button id="themeToggle" class="theme-toggle" type="button"
          aria-label="Toggle light or dark mode" title="Toggle Light / Dark Mode">
    <span class="theme-icon moon">&#9790;</span>
    <span class="theme-icon sun">&#9728;</span>
  </button>

  <main class="dashboard">
    <!-- ===== Header: Clock, Date, Greeting ===== -->
    <header class="card card-header">
      <div class="clock" id="clockTime">00:00:00</div>
      <div class="greeting-wrap">
        <h1>
          <span id="greetingWord">Good Morning</span>,
          <span id="nameDisplay" class="name-display" title="Click to edit your name">Friend</span>
          <input id="nameInput" class="name-input hidden" type="text" maxlength="24"
                 placeholder="Your name" autocomplete="off" />
          <button id="editNameBtn" class="icon-btn edit-name-btn" type="button"
                  aria-label="Edit your name" title="Edit your name">&#9998;</button>
        </h1>
      </div>
      <p class="date-text" id="dateText">Loading&hellip;</p>
    </header>

    <!-- ===== Focus Timer (Pomodoro) ===== -->
    <section class="card card-timer">
      <h2>Focus Timer</h2>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button id="timerStart" class="btn btn-primary" type="button">Start</button>
        <button id="timerStop" class="btn" type="button">Stop</button>
        <button id="timerReset" class="btn btn-ghost" type="button">Reset</button>
      </div>
      <div class="timer-hint" id="timerHint">Ready when you are.</div>
    </section>

    <!-- ===== Tasks ===== -->
    <section class="card card-tasks">
      <h2>Tasks</h2>
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="Add a new task&hellip;"
               maxlength="120" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div id="taskMessage" class="task-message" role="alert"></div>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <!-- ===== Quick Links ===== -->
    <section class="card card-links">
      <h2>Quick Links</h2>
      <form id="linkForm" class="link-form">
        <input id="linkName" type="text" placeholder="Link name"
               maxlength="40" autocomplete="off" />
        <input id="linkUrl" type="text" placeholder="example.com"
               autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add Link</button>
      </form>
      <div id="linksMessage" class="task-message" role="alert"></div>
      <div id="linkList" class="link-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
